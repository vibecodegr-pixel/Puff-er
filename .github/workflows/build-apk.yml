name: Build Puff-er APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Puff-er.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Puff-er-Release-APK
          path: build/app/outputs/flutter-apk/Puff-er.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Puff-er Release (Latest)"
          body: "Automatisch generierte Release-APK für Puff-er."
          files: build/app/outputs/flutter-apk/Puff-er.apk

      - name: Send Smartphone Notification via Gmail
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment 1 --body "🚀 @vibecodegr-pixel Dein neuer Puff-er Build ist fertig kompiliert und liegt im Google Drive Ordner 'Meine Ablage/apk/Puff-er/Puff-er.apk' bereit!" || true
